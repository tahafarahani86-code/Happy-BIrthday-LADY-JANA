<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday LADY JANA ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050005;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      z-index: 2;
      top: 8%;
      width: 100%;
      text-align: center;
      color: #ff315b;
      letter-spacing: 4px;
      text-shadow: 0 0 15px red;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    let startTime = performance.now();

    const ECG_TRACE_DURATION = 1300;
    const ECG_DURATION = 5000;
    const HEART_START = ECG_DURATION;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heart(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t))
      };
    }

    function drawHeart(size, progress, glow) {
      const points = 240;
      const count = Math.floor(points * progress);

      if (count < 2) return;

      ctx.beginPath();

      for (let i = 0; i <= count; i++) {
        const p = heart(i / points * Math.PI * 2);
        const x = width / 2 + p.x * size;
        const y = height / 2 + p.y * size;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#ff003c";

      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1, size * 0.16);
      ctx.shadowBlur = glow * 3;
      ctx.stroke();

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, size * 0.09);
      ctx.shadowBlur = glow * 1.8;
      ctx.stroke();

      ctx.strokeStyle = "#fff0f4";
      ctx.lineWidth = Math.max(1, size * 0.035);
      ctx.shadowBlur = glow;
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawName(beat) {
      const minSide = Math.min(width, height);
      const fontSize = Math.max(6, minSide * 0.011);

      const lineHeight = fontSize * 1.0;
      const gap = lineHeight * 0.3;
      const lines = ["L", "A", "D", "Y", "", "J", "A", "N", "A"];
      const totalHeight = lineHeight * 8 + gap;

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 19;
      ctx.lineWidth = 0.7;
      ctx.strokeStyle = "#fff0f4";

      const centerX = width / 2;
      const targetCenterY = height / 2 - minSide * 0.084;
      const offset = minSide * 0.008 * beat;

      let y = targetCenterY - totalHeight / 2 - offset
        + lineHeight / 2;

      for (const letter of lines) {
        if (letter === "") {
          y += gap;
          continue;
        }

        ctx.strokeText(letter, centerX, y);
        ctx.fillText(letter, centerX, y);
        y += lineHeight;
      }

      ctx.restore();
    }

    // Phase 1: ECG pulse transforms into hand-drawn neon lettering
    function drawECG(elapsed) {
      ctx.clearRect(0, 0, width, height);

      const centerY = height * 0.50;

      // First: a glowing ECG line travels across the screen.
      if (elapsed < ECG_TRACE_DURATION) {
        const progress = Math.max(0, Math.min(1, elapsed / ECG_TRACE_DURATION));
        const scanX = width * progress;

        function ecgY(x) {
          const p = x / width;
          const pulse = (center, spread) =>
            Math.exp(-Math.pow((p - center) / spread, 2));

          const signal =
            -0.10 * pulse(0.27, 0.025) +
             0.14 * pulse(0.465, 0.010) -
             0.78 * pulse(0.495, 0.008) +
             0.24 * pulse(0.520, 0.012) -
             0.20 * pulse(0.72, 0.045);

          return centerY + signal * Math.min(height * 0.42, 190);
        }

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        const drawTrace = (color, lineWidth, blur) => {
          ctx.beginPath();
          for (let x = 0; x <= scanX; x += 3) {
            const y = ecgY(x);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          if (scanX > 0) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.shadowColor = color;
            ctx.shadowBlur = blur;
            ctx.stroke();
          }
        };

        drawTrace("#ff003c", 6, 26);
        drawTrace("#ff1744", 3, 17);
        drawTrace("#fff0f4", 1.2, 7);

        if (scanX > 0) {
          ctx.beginPath();
          ctx.arc(scanX, ecgY(scanX), 3, 0, Math.PI * 2);
          ctx.fillStyle = "#fff0f4";
          ctx.shadowColor = "#ff1744";
          ctx.shadowBlur = 22;
          ctx.fill();
        }

        ctx.restore();
        return;
      }

      // After the ECG, reveal the LADY JANA birthday message.
      const message = "HAPPY BIRTHDAY LADY JANA";

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '26px "Zapfino", cursive';

      const measuredWidth = ctx.measureText(message).width || 1;
      const fontSize = Math.min(
        26,
        height * 0.055,
        (width - 80) * 26 / measuredWidth
      );

      ctx.font = `${fontSize}px "Zapfino", cursive`;

      const totalWidth = ctx.measureText(message).width;
      const left = (width - totalWidth) / 2;
      const textElapsed = elapsed - ECG_TRACE_DURATION;
      const textDuration = ECG_DURATION - ECG_TRACE_DURATION;
      const reveal = Math.max(
        0,
        Math.min(1, textElapsed / (textDuration - 1000))
      );
      const revealX = left + totalWidth * reveal;

      ctx.beginPath();
      ctx.rect(left - 2, 0, totalWidth * reveal, height);
      ctx.clip();

      ctx.lineJoin = "round";
      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1.5, fontSize * 0.055);
      ctx.shadowColor = "#ff003c";
      ctx.shadowBlur = 22;
      ctx.strokeText(message, width / 2, centerY);

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, fontSize * 0.03);
      ctx.shadowBlur = 12;
      ctx.strokeText(message, width / 2, centerY);

      ctx.fillStyle = "#fff0f4";
      ctx.shadowColor = "#fff0f4";
      ctx.shadowBlur = 5;
      ctx.fillText(message, width / 2, centerY);

      ctx.restore();

      if (reveal > 0 && reveal < 1) {
        ctx.beginPath();
        ctx.arc(revealX, centerY, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#fff0f4";
        ctx.shadowBlur = 20;
        ctx.fill();
      }
    }


    // Phase 3: the original layered neon heart animation
    function drawHearts(now, elapsed) {
      ctx.clearRect(0, 0, width, height);

      const pulse = now % 1800;

      const beat = pulse < 180
        ? 1 + Math.sin((pulse / 180) * Math.PI) * 0.12
        : pulse < 360
          ? 1 + Math.sin(((pulse - 180) / 180) * Math.PI) * 0.07
          : 1 + Math.sin(now * 0.002) * 0.012;

      for (let i = 0; i < 16; i++) {
        const progress = Math.min(
          1, Math.max(0, (elapsed - i * 150) / 2200)
        );

        const size = (0.22 + i * 0.075)
          * Math.min(width, height) / 48 * beat;

        drawHeart(size, progress, 30 + i * 2.5);
      }

      const nameProgress = Math.min(
        1, Math.max(0, (elapsed - 2200) / 1000)
      );

      if (nameProgress > 0) {
        ctx.globalAlpha = nameProgress;
        drawName(beat);
        ctx.globalAlpha = 1;
      }
    }

    function animate(now) {
      const elapsed = now - startTime;

      if (elapsed < ECG_DURATION) {
        drawECG(elapsed);
      } else {
        drawHearts(now, elapsed - HEART_START);
      }

      requestAnimationFrame(animate);
    }

    // Tap or click anywhere to replay the whole sequence
    document.addEventListener("pointerdown", () => {
      startTime = performance.now();
    });

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
