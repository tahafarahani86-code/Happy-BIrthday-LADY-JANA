<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday LADY JANA ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050005;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      z-index: 2;
      top: 8%;
      width: 100%;
      text-align: center;
      color: #ff315b;
      letter-spacing: 4px;
      text-shadow: 0 0 15px red;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="heartCanvas"></canvas>
  <div class="caption">MADE WITH LOVE ❤️</div>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    let startTime = performance.now();

    const ECG_DURATION = 7000;
    const HEART_START = ECG_DURATION;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heart(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t))
      };
    }

    function drawHeart(size, progress, glow) {
      const points = 240;
      const count = Math.floor(points * progress);

      if (count < 2) return;

      ctx.beginPath();

      for (let i = 0; i <= count; i++) {
        const p = heart(i / points * Math.PI * 2);
        const x = width / 2 + p.x * size;
        const y = height / 2 + p.y * size;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "#ff003c";

      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1, size * 0.16);
      ctx.shadowBlur = glow * 3;
      ctx.stroke();

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, size * 0.09);
      ctx.shadowBlur = glow * 1.8;
      ctx.stroke();

      ctx.strokeStyle = "#fff0f4";
      ctx.lineWidth = Math.max(1, size * 0.035);
      ctx.shadowBlur = glow;
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawName(beat) {
      const minSide = Math.min(width, height);
      const fontSize = Math.max(6, minSide * 0.011);

      const lineHeight = fontSize * 1.0;
      const gap = lineHeight * 0.3;
      const lines = ["L", "A", "D", "Y", "J", "A", "N", "A"];
      const totalHeight = lineHeight * 8;

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 19;
      ctx.lineWidth = 0.7;
      ctx.strokeStyle = "#fff0f4";

      const centerX = width / 2;
      const targetCenterY = height / 2 - minSide * 0.084;
      const offset = minSide * 0.008 * beat;

      let y = targetCenterY - totalHeight / 2 - offset
        + lineHeight / 2;

      for (const letter of lines) {
        if (letter === "") {
          y += gap;
          continue;
        }

        ctx.strokeText(letter, centerX, y);
        ctx.fillText(letter, centerX, y);
        y += lineHeight;
      }

      ctx.restore();
    }

    // Phase 1: ECG pulse transforms into hand-drawn neon lettering
    function drawECG(elapsed) {
      ctx.clearRect(0, 0, width, height);

      const centerY = height * 0.50;
      const waveformDuration = 4000;

      // Seven consecutive, short neon ECG beats.
      if (elapsed < waveformDuration) {
        const progress = Math.max(0, Math.min(1, elapsed / waveformDuration));
        const points = [
          [0.00, 0],
          [0.025, 0], [0.040, 0.035], [0.055, 0],
          [0.070, -0.05], [0.085, 0.14], [0.100, -0.06],
          [0.115, 0], [0.135, 0.10], [0.155, 0],

          [0.165, 0], [0.180, 0.035], [0.195, 0],
          [0.210, -0.05], [0.225, 0.14], [0.240, -0.06],
          [0.255, 0], [0.275, 0.10], [0.295, 0],

          [0.305, 0], [0.320, 0.035], [0.335, 0],
          [0.350, -0.05], [0.365, 0.14], [0.380, -0.06],
          [0.395, 0], [0.415, 0.10], [0.435, 0],

          [0.445, 0], [0.460, 0.035], [0.475, 0],
          [0.490, -0.05], [0.505, 0.14], [0.520, -0.06],
          [0.535, 0], [0.555, 0.10], [0.575, 0],

          [0.585, 0], [0.600, 0.035], [0.615, 0],
          [0.630, -0.05], [0.645, 0.14], [0.660, -0.06],
          [0.675, 0], [0.695, 0.10], [0.715, 0],

          [0.725, 0], [0.740, 0.035], [0.755, 0],
          [0.770, -0.05], [0.785, 0.14], [0.800, -0.06],
          [0.815, 0], [0.835, 0.10], [0.855, 0],

          [0.865, 0], [0.880, 0.035], [0.895, 0],
          [0.910, -0.05], [0.925, 0.14], [0.940, -0.06],
          [0.955, 0], [0.975, 0.10], [1.00, 0]
        ];

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, width * (0.04 + 0.92 * progress), height);
        ctx.clip();

        ctx.beginPath();
        points.forEach(([x, y], i) => {
          const px = width * (0.04 + x * 0.92);
          const py = centerY - y * Math.min(width, height) * 0.55;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.strokeStyle = "#ff003c";
        ctx.lineWidth = 5;
        ctx.shadowColor = "#ff003c";
        ctx.shadowBlur = 24;
        ctx.stroke();

        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 16;
        ctx.stroke();

        ctx.strokeStyle = "#fff0f4";
        ctx.lineWidth = 1;
        ctx.shadowBlur = 7;
        ctx.stroke();

        ctx.restore();
        return;
      }

      // Reveal the birthday message after the ECG.
      const message = "HAPPY BIRTHDAY LADY JANA";

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '26px "Zapfino", cursive';

      const measuredWidth = ctx.measureText(message).width || 1;
      const fontSize = Math.min(
        26,
        height * 0.055,
        (width - 80) * 26 / measuredWidth
      );

      ctx.font = `${fontSize}px "Zapfino", cursive`;

      const totalWidth = ctx.measureText(message).width;
      const left = (width - totalWidth) / 2;
      const reveal = Math.max(
        0,
        Math.min(1, (elapsed - waveformDuration) /
          (ECG_DURATION - waveformDuration - 1000))
      );
      const revealX = left + totalWidth * reveal;

      ctx.beginPath();
      ctx.rect(left - 2, 0, totalWidth * reveal, height);
      ctx.clip();

      ctx.lineJoin = "round";
      ctx.strokeStyle = "#ff003c";
      ctx.lineWidth = Math.max(1.5, fontSize * 0.055);
      ctx.shadowColor = "#ff003c";
      ctx.shadowBlur = 22;
      ctx.strokeText(message, width / 2, centerY);

      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = Math.max(1, fontSize * 0.03);
      ctx.shadowBlur = 12;
      ctx.strokeText(message, width / 2, centerY);

      ctx.fillStyle = "#fff0f4";
      ctx.shadowColor = "#fff0f4";
      ctx.shadowBlur = 5;
      ctx.fillText(message, width / 2, centerY);

      ctx.restore();

      if (reveal > 0 && reveal < 1) {
        ctx.beginPath();
        ctx.arc(revealX, centerY, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#fff0f4";
        ctx.shadowBlur = 20;
        ctx.fill();
      }
    }


    // Phase 3: the original layered neon heart animation
    function drawHearts(now, elapsed) {
      ctx.clearRect(0, 0, width, height);

      const pulse = now % 1800;

      const beat = pulse < 180
        ? 1 + Math.sin((pulse / 180) * Math.PI) * 0.12
        : pulse < 360
          ? 1 + Math.sin(((pulse - 180) / 180) * Math.PI) * 0.07
          : 1 + Math.sin(now * 0.002) * 0.012;

      for (let i = 0; i < 16; i++) {
        const progress = Math.min(
          1, Math.max(0, (elapsed - i * 150) / 2200)
        );

        const size = (0.22 + i * 0.075)
          * Math.min(width, height) / 48 * beat;

        drawHeart(size, progress, 30 + i * 2.5);
      }

      const nameProgress = Math.min(
        1, Math.max(0, (elapsed - 2200) / 1000)
      );

      if (nameProgress > 0) {
        ctx.globalAlpha = nameProgress;
        drawName(beat);
        ctx.globalAlpha = 1;
      }
    }

    function animate(now) {
      const elapsed = now - startTime;

      if (elapsed < ECG_DURATION) {
        drawECG(elapsed);
      } else {
        drawHearts(now, elapsed - HEART_START);
      }

      requestAnimationFrame(animate);
    }

    // Tap or click anywhere to replay the whole sequence
    document.addEventListener("pointerdown", () => {
      startTime = performance.now();
    });

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
